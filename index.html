<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><title>Level Up V3</title><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}body{margin:0;background:#070b14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;padding:15px 17px;background:#070b14ee;backdrop-filter:blur(14px);border-bottom:1px solid #223149;z-index:3}.top{display:flex;justify-content:space-between}.logo{font-weight:900;letter-spacing:2px;font-size:21px}.version{color:#67e8f9;border:1px solid #31506a;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.tag{font-size:10px;color:#6ee7b7;letter-spacing:1.4px}main{max-width:720px;margin:auto;padding:12px 15px 100px}.card{background:#0e1624;border:1px solid #223149;border-radius:22px;padding:17px;margin:12px 0}.hero{background:linear-gradient(145deg,#12291f,#0d1726)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted,.tiny{color:#8fa1b8}.tiny{font-size:12px}.level{font-size:50px;font-weight:950}.rank{color:#86efac;font-weight:800}.bar{height:13px;background:#182438;border-radius:99px;overflow:hidden;margin:12px 0}.fill{height:100%;background:linear-gradient(90deg,#34d399,#67e8f9)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.badge{background:#0a111d;border:1px solid #1d2a3d;border-radius:17px;padding:14px}.num{font-size:24px;font-weight:900}button{border:0;border-radius:14px;padding:11px 14px;background:#182337;color:#fff;font-weight:800}button.primary{background:#34d399;color:#03251d}button.blue{background:#38bdf8;color:#062236}.quest{padding:12px 0;border-bottom:1px solid #1e2b3e}.qline{display:flex;justify-content:space-between;align-items:center;gap:10px}.qname{font-weight:800}.reward{font-size:12px;color:#7f91a8}.pill{background:#16283a;color:#93c5fd;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800}nav{position:fixed;bottom:0;left:0;right:0;background:#080e18ed;border-top:1px solid #223149;display:flex;z-index:4}nav button{flex:1;background:transparent;border-radius:0;color:#71829a;padding:11px 3px 15px;font-size:12px}nav button.active{color:#6ee7b7}input{width:100%;padding:12px;margin:5px 0;border-radius:12px;border:1px solid #33445c;background:#09111d;color:#fff;font-size:16px}.photo{border:1px dashed #3b5875;background:#0a111d;border-radius:17px;padding:20px;text-align:center;display:block}.photo input{display:none}.result{margin-top:12px;background:#101d2e;border:1px solid #29425e;border-radius:17px;padding:14px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#34d399;color:#04251c;padding:13px 20px;border-radius:999px;font-weight:900;z-index:9}.hidden{display:none}
</style></head><body><header><div class="top"><div class="logo">⚡ LEVEL UP</div><div class="version">V3.0</div></div><div class="tag">SOCCER • FUEL • TRAIN • GROW</div></header><main id="app"></main><nav><button id="h" onclick="go('home')">🏠<br>HOME</button><button id="t" onclick="go('train')">⚽<br>TRAIN</button><button id="f" onclick="go('fuel')">🍽️<br>FUEL</button><button id="s" onclick="go('stats')">🏆<br>PROFILE</button></nav><div id="toast" class="toast hidden"></div><script>
const K="levelup-v3";let d=JSON.parse(localStorage.getItem(K)||"null")||{xp:0,water:0,goal:8,done:{},skills:{control:1,dribble:1,weak:1,passing:1,speed:1},soccer:0,workout:0,foods:[]};
const Q=[["morning","🌅","Morning water",50],["breakfast","🍳","Breakfast",100],["lunch","🥪","Lunch",100],["dinner","🍝","Dinner",100],["snack1","🍎","Snack #1",50],["snack2","🍌","Snack #2",50],["water","💧","Water goal",100],["shower","🚿","Shower routine",75],["soccer","⚽","Soccer session",200],["workout","🏋️","Workout",200]];
function save(){localStorage.setItem(K,JSON.stringify(d))}function level(){return Math.floor(d.xp/1000)+1}function toast(x){let e=document.getElementById("toast");e.textContent=x;e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),1400)}
function done(id,xp){if(d.done[id])return;d.done[id]=1;d.xp+=xp;if(id==="soccer")d.soccer++;if(id==="workout")d.workout++;save();toast("+"+xp+" XP • COMPLETE!");render()}
function go(p){localStorage.setItem("page",p);render()}function mission(q){let x=d.done[q[0]];return `<div class="quest"><div class="qline"><div><b>${q[1]} ${q[2]}</b><div class="reward">+${q[3]} XP</div></div><button onclick="done('${q[0]}',${q[3]})">${x?"✓ DONE":"CLAIM"}</button></div></div>`}
function home(){let n=Q.filter(q=>d.done[q[0]]).length;return `<div class="card hero"><div class="row"><div><div class="rank">PLAYER • LEVEL ${level()}</div><div class="level">${level()}</div></div><span class="pill">🔥 STREAK</span></div><div class="bar"><div class="fill" style="width:${d.xp%1000/10}%"></div></div><div class="row tiny"><span>${d.xp%1000}/1000 XP</span><span>${d.xp} total</span></div></div><div class="grid"><div class="stat">🎯<div class="num">${n}/${Q.length}</div><span class="muted">Missions</span></div><div class="stat">💧<div class="num">${d.water}/${d.goal}</div><span class="muted">Water</span></div></div><div class="card"><h2>🔥 TODAY'S MISSIONS</h2>${Q.map(mission).join("")}</div>`}
function train(){let a=[["control","🎯","Ball Control"],["dribble","⚡","Dribbling"],["weak","👟","Weak Foot"],["passing","🤝","Passing"],["speed","🏃","Speed & Agility"]];return `<div class="card hero"><div class="rank">⚽ TRAINING ARC</div><h2>Build your player.</h2><button class="primary" onclick="done('soccer',200)">COMPLETE SOCCER +200 XP</button></div><div class="card"><h2>SKILL TREE</h2>${a.map(x=>`<div class="quest"><div class="qline"><b>${x[1]} ${x[2]} LV ${d.skills[x[0]]}</b><button onclick="d.skills['${x[0]}']++;d.xp+=25;save();toast('+25 XP');render()">+25</button></div></div>`).join("")}</div><div class="card"><h2>🏋️ WORKOUT</h2><input placeholder="What did you train?"><button class="primary" onclick="done('workout',200)">LOG WORKOUT +200 XP</button></div>`}
function addFood(){let n=document.getElementById("fn").value||"Food";let c=+document.getElementById("fc").value||0,p=+document.getElementById("fp").value||0,a=+document.getElementById("fa").value||0,f=+document.getElementById("ff").value||0;d.foods.push({n,c,p,a,f});d.xp+=25;save();toast("+25 XP • FOOD LOGGED");render()}
function photo(x){if(!x.files[0])return;document.getElementById("scan").innerHTML=`<div class="result"><b>📸 Photo ready</b><p class="tiny">The camera/scanner interface is ready. Actual AI image nutrition requires connecting a vision AI API; V3 will not invent numbers from a photo.</p><button class="primary" onclick="manualScan()">ENTER AI ESTIMATE</button></div>`}
function manualScan(){document.getElementById("scan").innerHTML=`<div class="result"><b>🤖 AI ESTIMATE REVIEW</b><p class="tiny">Review/edit before saving.</p><input id="sn" placeholder="Food name"><input id="sc" type="number" placeholder="Calories"><input id="sp" type="number" placeholder="Protein (g)"><input id="sa" type="number" placeholder="Carbs (g)"><input id="sf" type="number" placeholder="Fat (g)"><button class="primary" onclick="saveScan()">SAVE +25 XP</button></div>`}
function saveScan(){d.foods.push({n:sn.value||"Scanned food",c:+sc.value||0,p:+sp.value||0,a:+sa.value||0,f:+sf.value||0});d.xp+=25;save();toast("+25 XP • SCAN SAVED");render()}
function fuel(){let food=Q.filter(q=>["breakfast","lunch","dinner","snack1","snack2"].includes(q[0]));return `<div class="card hero"><div class="rank">🍽️ FUEL ARC</div><h2>Food Scanner</h2><p class="muted">Photo nutrition is an estimate. Always review it.</p></div><div class="card"><h2>📸 SCAN FOOD</h2><label class="photo">📷<br><b>Take or choose a photo</b><input type="file" accept="image/*" capture="environment" onchange="photo(this)"></label><div id="scan"></div></div><div class="card"><h2>✏️ MANUAL FOOD</h2><input id="fn" placeholder="Food"><input id="fc" type="number" placeholder="Calories"><input id="fp" type="number" placeholder="Protein (g)"><input id="fa" type="number" placeholder="Carbs (g)"><input id="ff" type="number" placeholder="Fat (g)"><button class="primary" onclick="addFood()">SAVE FOOD +25 XP</button></div><div class="card"><h2>🍽️ MEALS + SNACKS</h2>${food.map(mission).join("")}</div><div class="card"><h2>💧 WATER</h2><div style="font-size:30px">${"💧".repeat(Math.min(d.water,d.goal))}${"▫️".repeat(Math.max(0,d.goal-d.water))}</div><p>${d.water}/${d.goal}</p><button class="primary" onclick="d.water++;if(d.water>=d.goal)done('water',100);save();render()">+1 WATER</button></div><div class="card"><h2>📋 LOGGED FOOD</h2>${d.foods.length?d.foods.map(x=>`<div class="quest"><b>${x.n}</b><div class="tiny">${x.c} kcal • ${x.p}g protein • ${x.a}g carbs • ${x.f}g fat</div></div>`).join(""):"<p class='muted'>Nothing logged yet.</p>"}</div>`}
function stats(){let c=d.foods.reduce((a,x)=>a+x.c,0),p=d.foods.reduce((a,x)=>a+x.p,0);return `<div class="card hero"><div class="rank">🏆 PLAYER PROFILE</div><div class="level">${level()}</div><div class="muted">${d.xp} total XP</div></div><div class="grid"><div class="stat">⚽<div class="num">${d.soccer}</div><span>Soccer</span></div><div class="stat">🏋️<div class="num">${d.workout}</div><span>Workouts</span></div><div class="stat">🔥<div class="num">${c}</div><span>Logged kcal</span></div><div class="stat">💪<div class="num">${p}g</div><span>Logged protein</span></div></div><div class="card"><h2>🎖️ ACHIEVEMENTS</h2><div class="grid"><div class="badge">⚽ First Session</div><div class="badge">🥇 First Touch</div><div class="badge">🏋️ Training Arc</div><div class="badge">👑 Rising Star</div></div></div>`}
function render(){let p=localStorage.getItem("page")||"home";["h","t","f","s"].forEach(x=>document.getElementById(x).classList.remove("active"));document.getElementById({home:"h",train:"t",fuel:"f",stats:"s"}[p]).classList.add("active");document.getElementById("app").innerHTML={home,train,fuel,stats}[p]()}render();
</script></body></html>
