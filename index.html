<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b14"><title>LEVEL UP V2</title><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;padding:18px;background:#070b14ee;backdrop-filter:blur(16px);border-bottom:1px solid #223149}.logo{font-weight:900;letter-spacing:2px;font-size:22px}.tag{font-size:11px;color:#6ee7b7;letter-spacing:1.5px}main{max-width:720px;margin:auto;padding:12px 15px 100px}.card{background:#0e1624;border:1px solid #223149;border-radius:22px;padding:17px;margin:12px 0;box-shadow:0 15px 40px #0005}.hero{background:linear-gradient(145deg,#12291f,#0d1726)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted,.tiny{color:#8fa1b8}.tiny{font-size:12px}.level{font-size:52px;font-weight:950;line-height:.9}.rank{color:#86efac;font-weight:800;letter-spacing:1px}.xpbar,.skillbar{height:13px;background:#182438;border-radius:99px;overflow:hidden;margin:13px 0 7px}.xpfill{height:100%;background:linear-gradient(90deg,#34d399,#67e8f9);transition:.5s}.skillbar{height:8px;margin-top:7px}.skillfill{height:100%;background:#67e8f9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.badge{background:#0a111d;border:1px solid #1d2a3d;border-radius:17px;padding:14px}.stat .num{font-size:25px;font-weight:900}button{border:0;border-radius:14px;padding:11px 14px;background:#182337;color:#fff;font-weight:800;font-size:14px}button.primary{background:#34d399;color:#03251d}button.blue{background:#38bdf8;color:#062236}button.done{background:#064e3b;color:#9ff4d3}h1,h2,p{margin-top:0}.sectiontitle{font-size:20px;margin:8px 0}.quest,.skill{padding:12px 0;border-bottom:1px solid #1e2b3e}.quest:last-child,.skill:last-child{border:0}.qline{display:flex;justify-content:space-between;align-items:center;gap:10px}.qname{font-weight:800}.reward{font-size:12px;color:#7f91a8;margin-top:3px}.pill{display:inline-block;background:#16283a;color:#93c5fd;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800}.skill{display:flex;gap:12px;align-items:center}.icon{font-size:28px;width:42px;text-align:center}nav{position:fixed;bottom:0;left:0;right:0;z-index:9;background:#080e18ed;backdrop-filter:blur(16px);border-top:1px solid #223149;display:flex;justify-content:center}nav button{background:transparent;border-radius:0;flex:1;max-width:145px;padding:11px 3px 15px;color:#71829a;font-size:12px}nav button.active{color:#6ee7b7}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:20;background:#34d399;color:#04251c;padding:13px 20px;border-radius:999px;font-weight:950;box-shadow:0 10px 35px #0008}.hidden{display:none}.modal{position:fixed;inset:0;background:#0009;z-index:15;display:grid;place-items:center;padding:20px}.modalbox{max-width:500px;width:100%;background:#0e1624;border:1px solid #30415a;border-radius:24px;padding:22px;text-align:center}input{width:100%;padding:12px;border-radius:12px;border:1px solid #33445c;background:#09111d;color:#fff;font-size:16px}
</style></head><body><header><div class="logo">⚡ LEVEL UP</div><div class="tag">SOCCER • FUEL • TRAIN • GROW</div></header><main id="app"></main><nav><button id="n-home" onclick="go('home')">🏠<br>HOME</button><button id="n-train" onclick="go('train')">⚽<br>TRAIN</button><button id="n-fuel" onclick="go('fuel')">🍽️<br>FUEL</button><button id="n-stats" onclick="go('stats')">🏆<br>PROFILE</button></nav><div id="toast" class="toast hidden"></div><div id="levelup" class="modal hidden"><div class="modalbox"><div style="font-size:58px">🆙</div><h1>LEVEL UP!</h1><p id="levelmsg"></p><button class="primary" onclick="closeLevel()">LET'S GO ⚡</button></div></div><script>
const K='levelup-v2';let s=JSON.parse(localStorage.getItem(K)||'null')||{xp:0,streak:0,water:0,goal:8,completed:{},skills:{control:1,dribble:1,weak:1,passing:1,speed:1},stats:{soccer:0,workout:0},calories:''};
const M=[['morning','🌅','Morning water',50],['breakfast','🍳','Breakfast',100],['lunch','🥪','Lunch',100],['dinner','🍝','Dinner',100],['snack1','🍎','Snack #1',50],['snack2','🍌','Snack #2',50],['water','💧','Water goal',100],['shower','🚿','Shower routine',75],['soccer','⚽','Soccer session',200],['workout','🏋️','Workout',200]];
function save(){localStorage.setItem(K,JSON.stringify(s))}function lvl(){return Math.floor(s.xp/1000)+1}function toast(x){let e=document.getElementById('toast');e.textContent=x;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1400)}
function complete(id,xp){if(s.completed[id])return;let old=lvl();s.completed[id]=1;s.xp+=xp;if(id==='soccer')s.stats.soccer++;if(id==='workout')s.stats.workout++;save();render();if(lvl()>old){document.getElementById('levelmsg').textContent='You reached Level '+lvl()+'! Keep building consistency.';document.getElementById('levelup').classList.remove('hidden')}else toast('+'+xp+' XP • COMPLETE!')}
function closeLevel(){document.getElementById('levelup').classList.add('hidden')}function go(p){localStorage.setItem('page',p);render()}function addWater(){s.water++;if(s.water>=s.goal)complete('water',100);save();render()}
function mission(m){let d=s.completed[m[0]];return '<div class="quest"><div class="qline"><div><div class="qname">'+m[1]+' '+m[2]+'</div><div class="reward">+'+m[3]+' XP</div></div><button class="'+(d?'done':'')+'" onclick="complete(\''+m[0]+'\','+m[3]+')">'+(d?'✓ DONE':'CLAIM')+'</button></div></div>'}
function home(){let done=M.filter(m=>s.completed[m[0]]).length,p=s.xp%1000/10;return '<div class="card hero"><div class="row"><div><div class="rank">PLAYER • LEVEL '+lvl()+'</div><div class="level">'+lvl()+'</div></div><div style="text-align:right"><span class="pill">🔥 '+s.streak+' DAY STREAK</span><div style="margin-top:8px;font-weight:900">'+s.xp.toLocaleString()+' XP</div></div></div><div class="xpbar"><div class="xpfill" style="width:'+p+'%"></div></div><div class="row tiny"><span>'+(s.xp%1000)+' / 1000 XP</span><span>Next level</span></div></div><div class="grid"><div class="stat">🎯<div class="num">'+done+'/'+M.length+'</div><span class="muted">Missions</span></div><div class="stat">💧<div class="num">'+s.water+'/'+s.goal+'</div><span class="muted">Water</span></div></div><div class="card"><div class="row"><h2 class="sectiontitle">🔥 TODAY\'S MISSIONS</h2><span class="pill">'+Math.round(done/M.length*100)+'%</span></div>'+M.map(mission).join('')+'</div><div class="card"><h2 class="sectiontitle">⚡ QUICK CHALLENGE</h2><p class="muted">Do 100 ball touches with your weaker foot.</p><button class="blue" onclick="challenge()">COMPLETE +150 XP</button></div>'}
function challenge(){if(s.completed.challenge)return toast('Already completed!');s.completed.challenge=1;s.xp+=150;save();toast('+150 XP • Challenge complete!');render()}
function train(){let a=[['control','🎯','Ball Control'],['dribble','⚡','Dribbling'],['weak','👟','Weak Foot'],['passing','🤝','Passing'],['speed','🏃','Speed & Agility']];return '<div class="card hero"><div class="rank">⚽ TRAINING ARC</div><h2>Build your player.</h2><p class="muted">Train consistently and level your skills.</p><button class="primary" onclick="complete(\'soccer\',200)">COMPLETE SOCCER SESSION +200 XP</button></div><div class="card"><h2 class="sectiontitle">SKILL TREE</h2>'+a.map(x=>'<div class="skill"><div class="icon">'+x[1]+'</div><div style="flex:1"><div class="row"><b>'+x[2]+'</b><span class="pill">LV '+s.skills[x[0]]+'</span></div><div class="skillbar"><div class="skillfill" style="width:'+Math.min(100,s.skills[x[0]]*10)+'%"></div></div></div><button onclick="skill(\''+x[0]+'\')">+25</button></div>').join('')+'</div><div class="card"><h2 class="sectiontitle">🏋️ WORKOUT</h2><input placeholder="What did you train today?"><br><br><button class="primary" onclick="complete(\'workout\',200)">LOG WORKOUT +200 XP</button></div>'}
function skill(k){s.skills[k]++;s.xp+=25;save();toast('+25 XP • Skill improved!');render()}
function fuel(){let food=M.filter(m=>['breakfast','lunch','dinner','snack1','snack2'].includes(m[0]));return '<div class="card hero"><div class="rank">🍽️ FUEL ARC</div><h2>Eat to support training.</h2><p class="muted">Track consistency rather than restrictive targets.</p></div><div class="card">'+food.map(mission).join('')+'</div><div class="card"><h2 class="sectiontitle">💧 WATER</h2><div style="font-size:32px">'+('💧'.repeat(Math.min(s.water,s.goal)))+('▫️'.repeat(Math.max(0,s.goal-s.water)))+'</div><p class="muted">'+s.water+'/'+s.goal+' drinks</p><button class="primary" onclick="addWater()">+1 WATER</button> <button onclick="s.water=Math.max(0,s.water-1);save();render()">−1</button></div><div class="card"><h2 class="sectiontitle">📊 OPTIONAL CALORIE LOG</h2><input type="number" value="'+s.calories+'" placeholder="Calories logged (optional)" onchange="s.calories=this.value;save()"><p class="tiny">Log only; no restrictive target.</p></div>'}
function stats(){let avg=Math.round(Object.values(s.skills).reduce((a,b)=>a+b,0)/5);return '<div class="card hero"><div class="rank">🏆 PLAYER PROFILE</div><div class="row"><div><div class="level">'+lvl()+'</div><div class="muted">PLAYER</div></div><div style="font-size:52px">⚽</div></div></div><div class="grid"><div class="stat">⭐<div class="num">'+s.xp+'</div><span class="muted">Total XP</span></div><div class="stat">⚽<div class="num">'+s.stats.soccer+'</div><span class="muted">Soccer</span></div><div class="stat">🏋️<div class="num">'+s.stats.workout+'</div><span class="muted">Workouts</span></div><div class="stat">🎯<div class="num">'+avg+'</div><span class="muted">Skill level</span></div></div><div class="card"><h2 class="sectiontitle">🎖️ ACHIEVEMENTS</h2><div class="grid"><div class="badge '+(s.stats.soccer>=1?'':'locked')+'">⚽<br><b>First Session</b></div><div class="badge '+(s.stats.soccer>=10?'':'locked')+'">🥇<br><b>First Touch</b></div><div class="badge '+(s.stats.workout>=25?'':'locked')+'">🏋️<br><b>Training Arc</b></div><div class="badge '+(s.xp>=5000?'':'locked')+'">👑<br><b>Rising Star</b></div></div></div>'}
function render(){let p=localStorage.getItem('page')||'home';document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById('n-'+(p==='train'?'train':p)).classList.add('active');document.getElementById('app').innerHTML={home,train,fuel,stats}[p]()}render();
</script></body></html>
